name: Build Domestic AI ZIP Packages
on:
  push:
    paths:
      - 'adapters/domestic-ai/**'
      - 'skills/**'
      - 'tools/build_packages.py'
      - '.github/workflows/build-domestic-ai-zips.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_packages.py --group domestic
      - uses: actions/upload-artifact@v4
        with:
          name: domestic-ai-packages
          path: |
            dist/*-common-v*.zip*
            dist/*-qwen-v*.zip*
            dist/*-doubao-v*.zip*
            dist/*-zhipu-v*.zip*
