name: Build Core and Claude Skill ZIPs
on:
  push:
    paths:
      - 'skills/**'
      - '.claude/skills/**'
      - 'tools/build_packages.py'
      - '.github/workflows/build-claude-skill-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_packages.py --group skills
      - uses: actions/upload-artifact@v4
        with:
          name: core-and-claude-packages
          path: |
            dist/*-core-v*.zip*
            dist/*-claude-v*.zip*
